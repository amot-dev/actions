on:
  workflow_call:
    inputs:
      release_body:
        required: true
        type: string
      tag_name:
        required: true
        type: string

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ inputs.release_body }}
        run: |
          ISSUES=$(echo "$RELEASE_BODY" | grep -oP '#\d+' | sed 's/#//' || true)

          if [ -z "$ISSUES" ]; then
            echo "No issue references found in release body."
            exit 0
          fi

          for ISSUE in $ISSUES; do
            echo "Closing #$ISSUE..."
            gh issue close "$ISSUE" \
              --repo "${{ github.repository }}" \
              --comment "Automatically closed by Release [${{ inputs.tag_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag_name }})."
          done
